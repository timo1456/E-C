<html>
    <title>Add Items</title>
    <body>
        <p>{{ saved }}</p>
        <form method="POST" action="/add-items" enctype="multipart/form-data">
            <input type="text" name="pr-name" id="" placeholder="Product Mame" required>
            <input type="number" name="pr-price" id="" placeholder="price" required>
            <input type="file" name="pr-img" id="" accept="image/*" required>
            <input type="text" name="pr-category" id="" required>
            <button type="submit">Add Product</button>
        </form>
    </body>
</html>
