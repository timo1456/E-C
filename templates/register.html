<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store | Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='log.css') }}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="brand">
                <span class="brand-mark">E</span>
                <div>
                    <strong>Store</strong>
                    <span>Shop smarter</span>
                </div>
            </div>

            <div class="auth-heading">
                <span class="eyebrow">GET STARTED</span>
                <h1>Create your account.</h1>
                <p>Join the store and start discovering products.</p>
            </div>

            {% if user_exist %}
                <div class="alert">{{ user_exist }}</div>
            {% endif %}

            <form method="POST" class="auth-form">
                <div class="field">
                    <label for="name">Name</label>
                    <input id="name" type="text" name="input-name" placeholder="Your name" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="input-email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="input-pass" placeholder="Create a password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="primary-button">Create account</button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="{{ url_for('login') }}">Sign in</a>
            </p>
        </section>
    </main>
</body>
</html>
