<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='log.css') }}">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="brand">
                <span class="brand-mark">E</span>
                <div>
                    <strong>Store</strong>
                    <span>Shop smarter</span>
                </div>
            </div>

            <div class="auth-heading">
                <span class="eyebrow">WELCOME BACK</span>
                <h1>Sign in to your account.</h1>
                <p>Continue shopping and keep track of your cart.</p>
            </div>

            {% if invalid %}
                <div class="alert">{{ invalid }}</div>
            {% endif %}

            <form method="POST" class="auth-form">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <div class="field-label">
                        <label for="password">Password</label>
                        <a href="#" class="small-link">Forgot password?</a>
                    </div>
                    <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <label class="remember">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>

                <button type="submit" class="primary-button">Sign in</button>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="{{ url_for('register') }}">Create one</a>
            </p>
        </section>
    </main>
</body>
</html>
